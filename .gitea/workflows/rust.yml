name: Rust

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_TERM_COLOR: always
  # renovate: datasource=github-tags depName=rust-lang/rustup
  RUSTUP_VERSION: "1.29.3"

jobs:
  build:
    runs-on: ubuntu-amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --silent --show-error --fail --output "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/x86_64-unknown-linux-gnu/rustup-init"
          chmod +x "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITEA_PATH"

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
